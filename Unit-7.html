<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資通安全概論第7單元自我評量測驗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            flex: 1;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .question-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .question-type {
            background: #e3f2fd;
            color: #1976d2;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-1px);
        }

        .option input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .option label {
            cursor: pointer;
            flex: 1;
            line-height: 1.5;
        }

        .option.correct {
            border-color: #4CAF50;
            background: #e8f5e8;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .option.user-selected {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .explanation {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .explanation h4 {
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation p {
            color: #533d03;
            line-height: 1.6;
        }

        .history-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .history-panel.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .history-item.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .history-item.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .history-item.unanswered {
            background: #e2e3e5;
            color: #383d41;
            border: 2px solid #d6d8db;
        }

        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
        }

        .toast.error {
            background: linear-gradient(135deg, #f44336, #ff7043);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .quiz-card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .question-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        .final-results {
            text-align: center;
            padding: 30px;
        }

        .final-results h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .score-display.excellent {
            color: #4CAF50;
        }

        .score-display.good {
            color: #FF9800;
        }

        .score-display.poor {
            color: #f44336;
        }


.action-btn {
  border: none;
  border-radius: 30px;
  background: #4763fa;
  color: #fff;
  font-size: 1rem;
  padding: 10px 22px;
  cursor: pointer;
  margin: 0 6px 8px 0;
  box-shadow: 0 2px 8px rgba(70,90,160,0.09);
  transition: background 0.2s, color 0.2s;
  font-family: inherit; /* 或你指定的字型 */
}
.action-btn:hover,
.action-btn:focus {
  background: #253095;
  color: #fff;
}





    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>資通安全概論 第7單元自我評量測驗</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="stats">
                <span>題目 <span id="currentNum">1</span> / <span id="totalNum">86</span></span>
                <span>答對：<span id="correctCount">0</span></span>
                <span>答錯：<span id="incorrectCount">0</span></span>
                <span>準確率：<span id="accuracy">0%</span></span>
            </div>
        </div>

        <div class="quiz-card" id="quizCard">
            </div>

        <div class="history-panel" id="historyPanel">
            <h3>答題記錄</h3>
            <div class="history-grid" id="historyGrid">
                </div>
        </div>

        <div class="buttons">
            <button class="btn btn-secondary" onclick="toggleHistory()">查看記錄</button>
            <button class="btn btn-secondary" onclick="prevQuestion()" id="prevBtn">上一題</button>
            <button class="btn btn-secondary" onclick="nextQuestion()" id="nextBtn">下一題</button>
            <button class="btn btn-success" onclick="restartQuiz()">重新開始</button>

<button class="action-btn" id="backHome" onclick="window.location.href='index.html'">回主頁</button>


        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 所有題目數據
        const questions = [
            {
                id: 1,
                question: "根據教材，安全性檢測包含哪兩個主要的項目？",
                type: "single",
                options: [
                    "風險評估與資產盤點",
                    "弱點掃描與滲透測試",
                    "網路監控與日誌分析",
                    "實體安全與環境控制"
                ],
                correct: [1],
                explanation: "教材在第7單元1-1節明確指出，安全性檢測主要包含「弱點掃描」與「滲透測試」兩項。"
            },
            {
                id: 2,
                question: "根據教材，A級機關需要多久進行一次弱點掃描？",
                type: "single",
                options: [
                    "每年1次",
                    "每年2次",
                    "每2年1次",
                    "無要求"
                ],
                correct: [1],
                explanation: "教材第7單元1-1節的表格顯示，A級機關的弱點掃描頻率為每年2次。"
            },
            {
                id: 3,
                question: "根據教材，C級機關需要多久進行一次滲透測試？",
                type: "single",
                options: [
                    "每年1次",
                    "每2年1次",
                    "無要求",
                    "每年2次"
                ],
                correct: [1],
                explanation: "教材第7單元1-1節的表格指出，C級機關的滲透測試頻率為每2年1次。"
            },
            {
                id: 4,
                question: "根據教材內容，關於「安全性檢測」的敘述，下列何者正確？(複選)",
                type: "multiple",
                options: [
                    "A級機關每年需進行1次滲透測試，以確保資安防護最高水準。",
                    "D級與E級機關由於資安責任等級最低，因此法規強制要求無需進行弱點掃描或滲透測試。",
                    "弱點掃描是一種自動化、非侵入式的檢測方式。",
                    "滲透測試是模擬駭客攻擊手法，目的是驗證系統安全防護措施的有效性。"
                ],
                correct: [0, 2, 3],
                explanation: "根據教材，A級機關要求每年進行1次滲透測試。弱點掃描是自動化的非侵入性檢測。滲透測試是模擬駭客攻擊手法，旨在驗證防護措施的有效性。D級與E級機關雖然法規無強制要求，但教材建議仍應自行評估風險後決定是否執行。"
            },
            {
                id: 5,
                question: "根據教材，弱點掃描的主要功能是什麼？",
                type: "single",
                options: [
                    "模擬駭客攻擊，以評估系統防護能力",
                    "針對特定漏洞進行深入利用",
                    "自動化掃描系統，找出已知漏洞及錯誤組態",
                    "僅對網路設備進行檢測"
                ],
                correct: [2],
                explanation: "教材在第7單元1-2節提到，弱點掃描是利用自動化工具，找出系統、服務、設備中已知的弱點與錯誤設定。"
            },
            {
                id: 6,
                question: "關於弱點掃描的目的與特性，下列敘述何者正確？(複選)",
                type: "multiple",
                options: [
                    "弱點掃描的主要優點是速度快、成本低，且能對「零時差漏洞」進行偵測。",
                    "掃描結果能作為高階主管或資安管理單位進行資安決策的重要參考基準。",
                    "弱點掃描是資安防護的基礎與第一道防線，它與滲透測試互補，以構築更全面的防護。",
                    "弱點掃描的一項重要目的，是透過後續的複掃來確認已修補的弱點是否確實被排除。"
                ],
                correct: [1, 2, 3],
                explanation: "弱點掃描無法偵測到「零時差漏洞」，因此選項A錯誤。掃描結果可作為管理依據與資安決策參考，選項B正確。教材強調弱點掃描是資安防護的「基礎」和「第一道防線」，選項C正確。弱點掃描也用於驗證弱點是否已被成功排除，選項D正確。"
            },
            {
                id: 7,
                question: "在「主機系統弱點掃描」的檢查項目中，通常會包含哪些内容？(複選)",
                type: "multiple",
                options: [
                    "針對作業系統未修正的已知弱點進行掃描。",
                    "透過字典或暴力破解方式測試帳號密碼的安全性。",
                    "檢查主機上是否安裝了不必要的服務或開放了不必要的通訊埠。",
                    "掃描主機以偵測是否有後門程式或木馬的存在。"
                ],
                correct: [0, 1, 2, 3],
                explanation: "根據教材，主機系統弱點掃描的檢查項目包含作業系統未修正的弱點、帳號密碼破解測試、系統不安全設定與通訊埠掃描，以及木馬後門程式掃描。"
            },
            {
                id: 8,
                question: "根據教材中 OWASP Top 10 2021的內容，下列哪些項目屬於應用程式安全檢測的範疇？(複選)",
                type: "multiple",
                options: [
                    "權限控制失效(Broken Access Control)",
                    "加密失敗(Cryptographic Failures)",
                    "注入式攻擊(Injection)",
                    "安全設定錯誤(Security Misconfiguration)"
                ],
                correct: [0, 1, 2, 3],
                explanation: "教材頁面列出了 OWASP Top 10 2021的所有十個項目，其中(A)、(B)、(C)、(D)皆為列出的項目。"
            },
            {
                id: 9,
                question: "關於弱點掃描的流程，下列敘述何者正確？(複選)",
                type: "multiple",
                options: [
                    "弱點掃描是一個持續改進的循環過程，類似PDCA循環。",
                    "「確認並修復弱點」是流程中最重要的環節，需強調其執行力。",
                    "執行複測的主要目的是為了避免「假修復」，確保修補措施確實被排除。",
                    "在「確認掃描需求」階段，必須獲得合法授權並知會相關單位，以避免影響業務。"
                ],
                correct: [0, 1, 2, 3],
                explanation: "教材明確指出弱點掃描是PDCA循環，修復弱點是最重要的環節，複測的目的是避免假修復，而確認掃描需求則需要合法授權與知會相關單位。"
            },
            {
                id: 10,
                question: "在執行弱點掃描服務時，服務提供者應採取的具體步驟包含哪些？(複選)",
                type: "multiple",
                options: [
                    "事前與目標組織充分溝通，以了解其網路架構和系統環境。",
                    "在每次掃描前，將掃描工具的弱點資料庫更新至最新版本。",
                    "應安排在非公務時段(例如夜間或週末)執行初次掃描。",
                    "在發現弱點後，應協助組織理解並提供具體的修補建議。"
                ],
                correct: [0, 1, 2, 3],
                explanation: "教材詳細列出了弱點掃描服務的步驟，包含事前溝通與了解、工具準備(更新資料庫)、執行初掃(時間安排)，以及協助修補與追蹤。"
            },
            {
                id: 11,
                question: "根據教材，一份完整的弱點掃描報告，通常應包含哪些内容？(複選)",
                type: "multiple",
                options: [
                    "執行計畫說明，如掃描期間、範圍、人員與工具。",
                    "詳細弱點清單，並標示弱點的風險等級與修補建議。",
                    "弱點排除清單，說明因特定原因暫不修補的弱點。",
                    "複掃報告的差異化分析，展示修復前後的比較。"
                ],
                correct: [0, 1, 2, 3],
                explanation: "教材列出了弱點掃描報告應包含的內容，包括執行計畫說明、詳細弱點清單、弱點排除清單以及複掃報告的差異化分析。"
            },
            {
                id: 12,
                question: "在規劃與執行弱點掃描時，應考量的關鍵因素為何？(複選)",
                type: "multiple",
                options: [
                    "掃描的發起位置，是從內部還是外部進行。",
                    "是否應具備登錄權限，以進行更深入的測試。",
                    "選擇侵入式或非侵入式的掃描方法。",
                    "應選擇委外執行還是由機關IT資安部門自行執行。"
                ],
                correct: [0, 1, 2, 3],
                explanation: "教材明確列出弱點掃描的考量因素，包含內部/外部掃描、有/無登錄權限、侵入式/非侵入式，以及委外/自行執行。"
            },
            {
                id: 13,
                question: "關於「內部掃描」與「外部掃描」的敘述，下列何者正確？(複選)",
                type: "multiple",
                options: [
                    "外部掃描是模擬外部駭客的攻擊，主要檢測對外開放的服務。",
                    "內部掃描是模擬內部人員或已入侵電腦的行為。",
                    "外部掃描通常會從組織的防火牆內部發起。",
                    "兩種掃描方式互補，全面性的資安防護應同時包含兩者。"
                ],
                correct: [0, 1, 3],
                explanation: "外部掃描是從組織防火牆「外部」發起，因此選項C錯誤。而選項A、B、D皆符合教材對內部與外部掃描的定義與關係描述。"
            },
            {
                id: 14,
                question: "相較於「無登錄權限」掃描，「有登錄權限」掃描的優勢有哪些？(複選)",
                type: "multiple",
                options: [
                    "能夠深入檢查系統內部配置與應用程式的登入後功能。",
                    "掃描結果更為全面且準確。",
                    "能夠觸及更多的程式碼路徑。",

                    "IDS是負責主動阻擋攻擊，而IPS僅負責偵測。"
                ],
                correct: [0, 1, 2],
                explanation: "教材明確指出IDS是被動、IPS是主動。IPS常部署在防火牆後，並利用特徵碼或行為分析來進行判斷。而選項(D)則是將IDS與IPS的角色對調，為錯誤敘述。"
            },
            {
                id: 74,
                question: "在網路安全中，為何需要「網路分段」？(複選)",
                type: "multiple",
                options: [
                    "減少網路廣播範圍，提升網路效能。",
                    "增加攻擊者在網路中的移動難度，限制其影響範圍。",
                    "確保所有設備都能連線到同一個網段，方便管理。",
                    "方便對不同安全等級的區域進行獨立的安全控制。"
                ],
                correct: [0, 1, 3],
                explanation: "網路分段能縮小網路廣播範圍，提升效能。同時，它能將網路隔離，使駭客難以橫向移動。選項(C)與網路分段的初衷相反，網路分段是為了隔離不同網段。"
            },
            {
                id: 75,
                question: "實體安全的第一道防線是什麼？",
                type: "single",
                options: [
                    "生物辨識系統",
                    "門禁管理系統",
                    "資通機房的空調與電力設備",
                    "實體環境的安全防護"
                ],
                correct: [3],
                explanation: "教材第7單元1-7節指出，實體安全的第一道防線是對資通機房的實體環境進行安全防護，例如建築物的結構。"
            },
            {
                id: 76,
                question: "下列哪一項不屬於教材中提到的實體安全威脅？",
                type: "single",
                options: [
                    "火災、水災等自然災害",
                    "斷電、空調失靈等環境因素",
                    "惡意軟體感染",
                    "未經授權人員擅闖"
                ],
                correct: [2],
                explanation: "惡意軟體感染屬於軟體與系統層面的威脅，不屬於實體安全範疇。"
            },
            {
                id: 77,
                question: "在實體安全中，為什麼「門禁系統」被認為是重要的？",
                type: "single",
                options: [
                    "因為它可以取代所有其他的實體防護措施",
                    "因為它是防止未經授權人員進入的第一道防線",
                    "因為它可以偵測並阻擋惡意網路流量",
                    "因為它可以確保機房的電力與空調供應"
                ],
                correct: [1],
                explanation: "教材在第7單元1-7節強調，門禁系統是防止未經授權人員進入的第二道防線的核心，用於實體存取控制。"
            },
            {
                id: 78,
                question: "在資通系統的實體安全中，下列哪一項不屬於環境控制的範疇？",
                type: "single",
                options: [
                    "電力供應的備援",
                    "空調與溫濕度控制",
                    "消防系統",
                    "監視錄影系統"
                ],
                correct: [3],
                explanation: "教材第7單元1-7節指出，監視錄影系統屬於實體存取控制，用於監控活動，而非環境控制。"
            },
            {
                id: 79,
                question: "根據教材，實體安全中的「三道防線」不包含下列何者？",
                type: "single",
                options: [
                    "第一道防線：建築物",
                    "第二道防線：門禁與存取控制",
                    "第三道防線：機房內部管理",
                    "第四道防線：網路加密"
                ],
                correct: [3],
                explanation: "教材第7單元1-7節將實體安全分為三道防線，分別是建築物、門禁與存取控制、以及機房內部管理。網路加密是網路安全的範疇。"
            },
            {
                id: 80,
                question: "在實體安全中，下列哪一種驗證方式，因為唯一且難以偽造，被認為是最高級別的驗證方式？",
                type: "single",
                options: [
                    "密碼驗證",
                    "智慧卡或磁卡",
                    "生物辨識",
                    "鍵盤輸入"
                ],
                correct: [2],
                explanation: "教材第7單元1-7節說明，生物辨識（如指紋、虹膜）因為其唯一性，是最高級別的驗證方式。"
            },
            {
                id: 81,
                question: "教材提到，為何需要在資通機房內設置空調與溫濕度控制？",
                type: "single",
                options: [
                    "為了讓工作人員有舒適的工作環境",
                    "因為可以讓機房的網路連線更穩定",
                    "為了防止設備因過熱或潮濕而故障",
                    "為了防止駭客入侵"
                ],
                correct: [2],
                explanation: "教材第7單元1-7節說明，良好的溫濕度控制有助於確保設備正常運作，避免因過熱或潮濕而故障。"
            },
            {
                id: 82,
                question: "在實體安全中，下列哪一項措施是用來應對「火災」威脅？",
                type: "single",
                options: [
                    "不斷電系統（UPS）",
                    "消防系統",
                    "門禁管理",
                    "監視錄影系統"
                ],
                correct: [1],
                explanation: "消防系統是專門用於應對火災威脅的實體安全措施。"
            },
            {
                id: 83,
                question: "教材提到，下列何者是確保實體安全的第一道防線？",
                type: "single",
                options: [
                    "門禁卡",
                    "監視器",
                    "資通機房的建築結構",
                    "消防系統"
                ],
                correct: [2],
                explanation: "教材第7單元1-7節明確指出，實體安全的第一道防線是建築物本身的結構安全。"
            },
            {
                id: 84,
                question: "關於資通機房的「實體安全」，下列敘述何者正確？(複選)",
                type: "multiple",
                options: [
                    "實體安全的三道防線中，第一道防線是機房的建築結構與選址。",
                    "門禁系統是實體存取控制的核心，屬於第二道防線。",
                    "第三道防線主要保護機房內部的伺服器機櫃與設備。",
                    "實體安全威脅僅限於人為惡意破壞。"
                ],
                correct: [0, 1, 2],
                explanation: "教材將實體安全分為三道防線，其定義與選項(A)(B)(C)相符。然而，實體安全威脅也包含自然災害（如火災、水災）與環境因素（如斷電），因此選項(D)錯誤。"
            },
            {
                id: 85,
                question: "在資通機房的實體安全中，下列哪些措施屬於「環境控制」的範疇？(複選)",
                type: "multiple",
                options: [
                    "確保機房有足夠的空調，維持適當的溫度與濕度。",
                    "建置火災偵測與自動滅火的消防系統。",
                    "提供備援電力系統，如發電機與不斷電系統（UPS）。",
                    "使用生物辨識或門禁卡來控制人員進出。"
                ],
                correct: [0, 1, 2],
                explanation: "教材將環境控制定義為電力、空調、消防等，用以維持機房設備的正常運作。選項(D)屬於實體存取控制。"
            },
            {
                id: 86,
                question: "關於實體安全中的「存取控制」，下列敘述何者正確？(複選)",
                type: "multiple",
                options: [
                    "監視錄影系統可以用於事後追查入侵事件。",
                    "生物辨識是最高級別的驗證方式，因為它唯一且難以偽造。",
                    "門禁系統是唯一的實體存取控制方式。",
                    "存取控制的目的是防止未經授權的人員進入機房。"
                ],
                correct: [0, 1, 3],
                explanation: "監視器能提供事後追查的證據。生物辨識是最高級別的驗證方式。然而，除了門禁系統，門鎖、門禁卡、警衛等也都是實體存取控制的一部分，因此選項(C)錯誤。"
            }
        ];


        // 全域變數
        let currentQuestion = 0;
        let userAnswers = {}; // 儲存使用者答案
        let showingExplanation = false;

        // 初始化測驗
        function initQuiz() {
            document.getElementById('totalNum').textContent = questions.length;
            loadQuestion();
            updateStats();
            generateHistoryGrid();
        }

        // 載入題目
        function loadQuestion() {
            const question = questions[currentQuestion];
            const quizCard = document.getElementById('quizCard');
            
            // 判斷題目類型
            const typeLabel = question.type === 'single' ? '單選題' : '複選題';
            const inputType = question.type === 'single' ? 'radio' : 'checkbox';
            
            // 生成選項HTML
            let optionsHTML = '';
            question.options.forEach((option, index) => {
                const isSelected = userAnswers[currentQuestion] && userAnswers[currentQuestion].includes(index);
                optionsHTML += `
                    <div class="option" onclick="selectOption(${index})">
                        <input type="${inputType}" name="q${currentQuestion}" value="${index}" ${isSelected ? 'checked' : ''} onchange="handleOptionChange(${index})">
                        <label>(${String.fromCharCode(65 + index)}) ${option}</label>
                    </div>
                `;
            });

            quizCard.innerHTML = `
                <div class="question-header">
                    <span class="question-number">第 ${currentQuestion + 1} 題</span>
                    <span class="question-type">${typeLabel}</span>
                </div>
                <div class="question-text">${question.question}</div>
                <div class="options">${optionsHTML}</div>
                <div class="buttons">
                    <button class="btn btn-primary" onclick="submitAnswer()">提交答案</button>
                    <button class="btn btn-secondary" onclick="showExplanation()" id="explanationBtn" style="display: none;">查看解答</button>
                </div>
                <div class="explanation" id="explanation">
                    <h4>📝 解答說明</h4>
                    <p><strong>正確答案：</strong>${question.correct.map(i => String.fromCharCode(65 + i)).join(', ')}</p>
                    <p>${question.explanation}</p>
                </div>
            `;

            // 更新進度
            document.getElementById('currentNum').textContent = currentQuestion + 1;
            document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            // 更新按鈕狀態
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = currentQuestion === questions.length - 1;
            
            showingExplanation = false;
        }

        // 選擇選項
        function selectOption(index) {
            const question = questions[currentQuestion];
            const checkbox = document.querySelector(`input[value="${index}"]`);
            
            if (question.type === 'single') {
                // 單選題：取消所有選項，只選中當前項
                document.querySelectorAll(`input[name="q${currentQuestion}"]`).forEach(input => {
                    input.checked = false;
                });
                checkbox.checked = true;
                userAnswers[currentQuestion] = [index];
            } else {
                // 複選題：切換選中狀態
                checkbox.checked = !checkbox.checked;
                if (!userAnswers[currentQuestion]) {
                    userAnswers[currentQuestion] = [];
                }
                
                if (checkbox.checked) {
                    if (!userAnswers[currentQuestion].includes(index)) {
                        userAnswers[currentQuestion].push(index);
                    }
                } else {
                    userAnswers[currentQuestion] = userAnswers[currentQuestion].filter(i => i !== index);
                }
            }
            
            updateHistoryGrid();
        }

        // 處理選項變化
        function handleOptionChange(index) {
            // 這個函數由於selectOption已經處理了邏輯，可以保持空白
        }

        // 提交答案
        function submitAnswer() {
            const question = questions[currentQuestion];
            const userAnswer = userAnswers[currentQuestion];
            
            if (!userAnswer || userAnswer.length === 0) {
                showToast('請選擇答案！', 'error');
                return;
            }

            // 檢查答案正確性
            const isCorrect = arraysEqual(userAnswer.sort(), question.correct.sort());
            
            // 顯示結果
            highlightOptions(isCorrect);
            
            // 播放音效（模擬）
            if (isCorrect) {
                showToast('答對了！', 'success');
            } else {
                showToast('答錯了，請查看解答', 'error');
            }
            
            // 顯示解答按鈕
            document.getElementById('explanationBtn').style.display = 'inline-block';
            
            updateStats();
            updateHistoryGrid();
        }

        // 比較陣列相等
        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        // 標示選項正確性
        function highlightOptions(isCorrect) {
            const question = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            options.forEach((option, index) => {
                const input = option.querySelector('input');
                option.classList.remove('correct', 'incorrect', 'user-selected');
                
                if (question.correct.includes(index)) {
                    option.classList.add('correct');
                } else if (input.checked) {
                    option.classList.add('incorrect');
                }
                
                if (input.checked) {
                    option.classList.add('user-selected');
                }
            });
        }

        // 顯示解答
        function showExplanation() {
            const explanation = document.getElementById('explanation');
            explanation.classList.add('show');
            showingExplanation = true;
        }

        // 上一題
        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        // 下一題
        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        }

        // 跳到指定題目
        function goToQuestion(questionIndex) {
            currentQuestion = questionIndex;
            loadQuestion();
            toggleHistory(); // 關閉歷史面板
        }

        // 切換歷史記錄面板
        function toggleHistory() {
            const historyPanel = document.getElementById('historyPanel');
            historyPanel.classList.toggle('show');
        }

        // 生成歷史記錄網格
        function generateHistoryGrid() {
            const historyGrid = document.getElementById('historyGrid');
            let gridHTML = '';
            
            for (let i = 0; i < questions.length; i++) {
                let status = 'unanswered';
                if (userAnswers[i]) {
                    const isCorrect = arraysEqual(userAnswers[i].sort(), questions[i].correct.sort());
                    status = isCorrect ? 'correct' : 'incorrect';
                }
                
                gridHTML += `
                    <div class="history-item ${status}" onclick="goToQuestion(${i})">
                        ${i + 1}
                    </div>
                `;
            }
            
            historyGrid.innerHTML = gridHTML;
        }

        // 更新歷史記錄網格
        function updateHistoryGrid() {
            generateHistoryGrid();
        }

        // 更新統計資料
        function updateStats() {
            let correctCount = 0;
            let incorrectCount = 0;
            
            Object.keys(userAnswers).forEach(questionIndex => {
                const question = questions[parseInt(questionIndex)];
                const userAnswer = userAnswers[questionIndex];
                
                if (userAnswer && userAnswer.length > 0) {
                    const isCorrect = arraysEqual(userAnswer.sort(), question.correct.sort());
                    if (isCorrect) {
                        correctCount++;
                    } else {
                        incorrectCount++;
                    }
                }
            });
            
            const totalAnswered = correctCount + incorrectCount;
            const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
            
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;
            document.getElementById('accuracy').textContent = `${accuracy}%`;
        }

        // 顯示提示訊息
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 重新開始測驗
        function restartQuiz() {
            if (confirm('確定要重新開始測驗嗎？所有答案將被清除。')) {
                userAnswers = {};
                currentQuestion = 0;
                showingExplanation = false;
                initQuiz();
                showToast('測驗已重新開始', 'success');
            }
        }

        // 頁面載入完成後初始化
        window.addEventListener('load', initQuiz);
    </script>
</body>
</html>
